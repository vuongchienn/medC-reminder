<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>MedReminder</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Medication Reminder</p>
          <h1>Stay on track</h1>
        </div>
        <button id="themeToggle" class="ghost-btn">🌙</button>
      </header>

      <main class="content">
        <section class="card hero-card">
          <div class="hero-text">
            <h2>Upcoming doses</h2>
            <p id="todaySummary">Loading today’s reminders…</p>
          </div>
          <button id="addMedicineBtn" class="primary-btn">+ Add medicine</button>
        </section>

        <section class="card">
          <div class="section-title">
            <h3>Today’s schedule</h3>
            <a href="#history">View history</a>
          </div>
          <div id="reminderList" class="stack"></div>
        </section>

        <section class="card">
          <div class="section-title">
            <h3>Medicines</h3>
            <a href="#dashboard">Dashboard</a>
          </div>
          <div class="toolbar">
            <input id="searchInput" placeholder="Search by medicine name" />
            <select id="statusFilter">
              <option value="all">All</option>
              <option value="active">Active</option>
              <option value="paused">Paused</option>
            </select>
            <button id="backupBtn" class="ghost-btn">Backup</button>
          </div>
          <div id="medicineList" class="stack"></div>
        </section>

        <section id="dashboard" class="card">
          <h3>Dashboard</h3>
          <div class="stats-grid">
            <div class="stat-box"><strong id="totalMedicines">0</strong><span>Medicines</span></div>
            <div class="stat-box"><strong id="todayTaken">0</strong><span>Taken today</span></div>
            <div class="stat-box"><strong id="adherenceRate">0%</strong><span>Adherence</span></div>
            <div class="stat-box"><strong id="missedCount">0</strong><span>Missed</span></div>
          </div>
          <div class="stack">
            <div id="streakBox" class="item-card"></div>
            <div id="warningBox" class="item-card"></div>
            <div id="forgottenList" class="stack"></div>
          </div>
        </section>

        <section id="history" class="card">
          <div class="section-title">
            <h3>History</h3>
            <button id="exportBtn" class="ghost-btn">Export</button>
          </div>
          <div id="historyList" class="stack"></div>
        </section>
      </main>
    </div>

    <dialog id="medicineDialog">
      <form method="dialog" id="medicineForm" class="dialog-form">
        <h3>Add medicine</h3>
        <input name="name" placeholder="Medicine name" required />
        <textarea name="description" placeholder="Description"></textarea>
        <input name="dosage" placeholder="Dosage" />
        <input name="unit" placeholder="Unit" value="viên" />
        <textarea name="notes" placeholder="Notes"></textarea>
        <input name="startDate" type="date" />
        <input name="endDate" type="date" />
        <input name="schedules" placeholder="Times, e.g. 08:00,12:00" />
        <div class="dialog-actions">
          <button value="cancel" class="ghost-btn">Cancel</button>
          <button value="default" class="primary-btn">Save</button>
        </div>
      </form>
    </dialog>

    <script src="/js/app.js"></script>
  </body>
</html>
